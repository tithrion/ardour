name: Build Ardour for macOS ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14 # Native Apple Silicon M1 Runner (ARM64)
    
    steps:
      - name: Repository klonen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Abhängigkeiten via Homebrew installieren
        run: |
          brew update
          brew install python3 pkg-config boost glib glibmm@2.66 libsndfile libarchive liblo taglib vamp-plugin-sdk rubberband libusb jack aubio libpng pango libsigc++@2 cairomm@1.14 pangomm@2.46 lv2 cppunit libwebsockets sord sratom lilv jpeg

      - name: Python-Symlink sicherstellen
        run: |
          PYTHON_PATH=$(which python3)
          sudo ln -s "$PYTHON_PATH" /opt/homebrew/bin/python || true

      - name: Ardour mit Waf konfigurieren
        run: |
          export PATH="/opt/homebrew/opt/libarchive/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/libarchive/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPLUS_INCLUDE_PATH="/opt/homebrew/include:$CPLUS_INCLUDE_PATH"
          ./waf configure 

      - name: Ardour kompilieren
        run: |
          ./waf

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-arm64-binaries
          path: gtk2_ardour/
